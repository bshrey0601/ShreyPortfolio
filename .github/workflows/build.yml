name: Build site

# Rebuilds index.html whenever source.html (or the build setup) changes on main.
on:
  push:
    branches: [main]
    paths: [source.html, build.mjs, package.json]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit the rebuilt index.html
        run: |
          if git diff --quiet -- index.html && git ls-files --error-unmatch index.html >/dev/null 2>&1; then
            echo "index.html already up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild index.html from source.html"
          git push
          # Ask GitHub Pages to republish (pushes made by this workflow don't always trigger it).
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
