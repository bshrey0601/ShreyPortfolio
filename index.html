lidated productivity and KPI data for 150+ employees into executive-ready Excel reports (PivotTables, XLOOKUP, SUMIFS) and PowerPoint dashboards.","Validated and reconciled 1,000+ financial transaction records every day and flagged exceptions ahead of finance reviews.","Converted large datasets into variance analyses, KPI scorecards and visualizations across 12+ monthly MIS cycles, coordinating inputs from finance and operations."],r:"Leadership had a single performance view that informed staffing decisions, finance reviews saw fewer downstream errors, and senior management received a decision-ready narrative each month."},mine:"I built the reports and ran the validation. The staffing decisions were leadership's.",skills:["Advanced Excel","PowerPoint","Reconciliation","Data Validation","Variance Analysis","KPI Dashboards","Cross-Functional Collaboration"]},{id:"khodiyar",role:"Finance Intern",org:"Khodiyar Infrastructure",place:"Gandhinagar, India",period:"Jun 2023 \u2013 Dec 2023",overview:"At a real estate and construction firm, I reconciled financial records and built the dashboards the owner used to track the business.",facts:[["500+","financial records reconciled weekly"],["2 to 3","Excel dashboards built for the owner"]],star:{s:"The firm's owner needed reliable financial records and a clearer view of operational performance.",t:"Check the records every week and make the numbers easy to read.",a:["Reconciled and validated 500+ financial records weekly, flagging exceptions systematically.","Built 2 to 3 Excel dashboards with PivotTables, charts and summaries."],r:"Internal controls were stronger, and the owner used the dashboards to track operational KPIs and performance trends."},skills:["Advanced Excel","Reconciliation","Data Validation","KPI Dashboards"]}],Ip=["All","Finance","Crypto & Blockchain","Analytics","AI","Strategy","Product"],Oe=[{id:"cloud-cost-analyst",featured:!0,title:"Cloud Cost Analyst",oneLiner:"A self-checking AI analyst for cloud spend",summary:"A FinOps analysis app built on Microsoft's public Azure dataset. It forecasts spend, flags anomalies, names the deployment behind each change, and lets an AI analyst answer questions only after every number has been re-checked against the data.",period:"Nov 2026 \u2013 Present",status:"Live",role:"Solo project",categories:["Analytics","AI","Finance","Product"],tools:["Python","SQL","DuckDB","NumPy","pandas","Streamlit","Plotly","statsmodels","pytest","Claude and Gemini APIs","AI Agents","Prompt Engineering","Git/GitHub","Streamlit Community Cloud"],concepts:["Forecasting","Anomaly Detection","Budget vs. Actual","Variance Analysis","Reconciliation","Data Validation","Data Quality","Reporting Automation"],source:"repo",metrics:[["$21.23M","monthly spend analysed at list price"],["$3.75M","a month in savings identified, 17.7% of spend"],["0.86%","next-day forecast error, vs 1.04% for Holt-Winters"],["0.946","anomaly-detection F1 on held-out subscriptions"],["99.8%","of 531 injected errors caught by the auditor"],["8 of 8","reconciliation checks tie out to the cent"]],star:{s:"Product finance teams are asked the same questions about engineering cloud spend every cycle: why did it move, what will it be next week, what is unusual and where can we save. AI tools can draft those answers quickly, but a finance team cannot use a memo whose numbers might be wrong.",t:"Build a working analysis app on real usage data that answers those four questions, and design the AI layer so that no number reaches a reader without being verified. I set the scope and built it alone, using only public data: 30 days of Microsoft's Azure Public Dataset V2, priced at published list rates.",a:["Modeled 2.7M virtual machines across 6,687 subscriptions into a DuckDB star schema with a 12.7M-row hourly cost table, and wrote 8 reconciliation checks that tie every mart back to the source.","Built a forecaster and an anomaly detector in NumPy and tested both against standard baselines on data they had not seen.","Designed a four-step agent: planner, analyst, writer and auditor. The auditor uses no AI. It re-runs every cited figure on a fresh connection and rejects the memo if anything fails to match.","Added root-cause attribution that breaks each team's cost change down by deployment, so every alert names what changed.","Packaged it as a Streamlit app with seven views and a one-click, 9-slide cost review deck whose commentary must pass the same audit."],r:"The app reconciles $21.23M of monthly spend to the cent and identifies $3.75M a month (17.7%) in idle and rightsizing savings. The forecaster beats Holt-Winters on next-day error (0.86% against 1.04%). The anomaly detector reaches an F1 of 0.946 with 17.6 times fewer false alarms than a rolling z-score. The auditor caught 99.8% of 531 deliberately corrupted figures without flagging a clean one."},how:[["Stage and price the trace","438 MB of virtual-machine records are staged in SQL and priced at Azure pay-as-you-go list rates."],["Build the warehouse","Dimensions for subscription, machine shape and time feed a 12.7M-row hourly cost table and the reporting marts."],["Reconcile","Eight automated checks confirm that every downstream total ties back to the source table."],["Model","Forecasting, anomaly detection, root cause and savings levers run on the marts."],["Answer and audit","The agent plans, runs its tools, drafts a memo and hands it to the auditor. A failed audit never reaches the reader."]],challenges:["A forecast that came out 21% low turned out to be a data problem: the last hour of the trace was only partly observed. I fixed it in the staging SQL and added a regression test.","My first forecasting model overfit seasonal lags and lost to simply repeating the last value, which pushed me toward a simpler blended design.","A model tuned on one-step-ahead error compounded into a 50% week-ahead drop. Tuning on 24-hour-ahead error fixed it.","A week-ahead improvement did not hold up on 50 team-level series the model had never seen, so the app uses a simple baseline for that case."],limits:["2019 usage is priced at 2026 list rates, so this is a realistic cost signal and not Microsoft's actual internal cost.","Thirty days of history limits how far ahead the forecasts can be validated.","The agent's benchmark results were run in offline mode. The live AI path needs an API key to benchmark."],learned:"Deciding not to ship a model is part of the result. A clean test on series the model had never seen confirmed one claim and overturned another, and the app is better for saying so.",next:"Benchmark the live AI path and test the models on a longer history.",proof:"Every figure on this page can be reproduced with the scripts in the repository's eval folder.",links:{code:"https://github.com/bshrey0601/Cloud-Cost-Analysis",live:"https://cloud-cost-analysis-asrlr3y69dxzjzdfvifvhn.streamlit.app/",liveNote:"If the app has been idle, Streamlit takes about a minute to wake it."},shots:[{src:"assets/projects/cloud-cost-overview.webp",w:1280,h:914,alt:"Cloud Cost Analyst overview: $21.23M 30-day spend, $3.75M savings available, daily spend by workload and top subscriptions.",cap:"Overview: spend, savings and the largest subscriptions"},{src:"assets/projects/cloud-cost-forecast.webp",w:1280,h:914,alt:"Forecast view of the Cloud Cost Analyst app.",cap:"Forecast with a 90% interval"},{src:"assets/projects/cloud-cost-root-cause.webp",w:1280,h:914,alt:"Root cause panel naming the deployment behind a cost change.",cap:"Root cause: the deployment behind a change"},{src:"assets/projects/cloud-cost-ask-analyst.webp",w:1280,h:914,alt:"Ask the Analyst view showing an audited AI memo.",cap:"Ask the Analyst: an audited memo"},{src:"assets/projects/cloud-cost-qbr-variance.webp",w:1067,h:600,alt:"Variance slide from the generated cost review deck.",cap:"A slide from the generated cost review"}]},{id:"ma-deal-cracker",featured:!0,title:"M&A Deal Cracker",oneLiner:"An M&A valuation app where every number links to its filing",summary:"Enter a target and an acquirer. The app pulls reported financials from SEC EDGAR, builds WACC and a five-year DCF, tests the deal structure with Monte Carlo simulation, and writes an investment memo whose figures are checked against the model.",period:"Mar 2026 \u2013 Present",status:"Live",role:"Solo project",categories:["Finance","AI","Product"],tools:["Python","Flask","Claude and Gemini APIs","SEC EDGAR","Render","FRED","U.S. Treasury","Damodaran Datasets","Yahoo Finance","Prompt Engineering"],concepts:["DCF","WACC","Comparable Company Analysis","Precedent Transactions","Accretion/Dilution","Scenario and Sensitivity Analysis","Monte Carlo Simulation","EV/EBITDA","P/E"],stackNote:"The first version was a Python and Flask app using the Gemini API. The current version in the repository is a TypeScript web app built on SEC EDGAR data.",source:"repo",metrics:[["2 tickers","in, WACC and a five-year DCF with 3 scenarios out"],["5,000","Monte Carlo runs for each deal"],["9","accuracy checks on every SEC-sourced company"],["6","closest peers picked by industry code and revenue"]],star:{s:"The idea came from a Kelley School of Business case competition. Screening a deal meant collecting filings, building the valuation by hand and then defending numbers that were hard to trace back to a source.",t:"Build a tool that takes two tickers and returns a deal analysis an analyst could check line by line. I built it alone, starting with a simple version and then rebuilding it on filed data.",a:["Shipped a first version in Python and Flask that used the Gemini API to produce deal summaries, valuation multiples, accretion and dilution estimates, synergy sizing, risk flags and a memo.","Rebuilt the data layer on SEC EDGAR filings, with last-twelve-month figures and a click-through from each number to the filing behind it.","Added live cost-of-capital inputs (the 10-year Treasury yield and Damodaran's industry betas and risk premiums) and a five-year unlevered DCF with bear, base and bull cases.","Modeled deal structure: cash and stock mix, financing cost, synergies, purchase price allocation and pro-forma EPS, each tested with a 5,000-run Monte Carlo simulation.","Automated the cross-checks: trading comps picked by industry code and revenue, precedent deals read from SEC merger filings, and a football-field chart across methods.","Made the AI memo checkable. Every number it writes is matched back to the model, and anything unmatched is highlighted."],r:"A deployed app that turns two tickers into WACC, a three-scenario DCF, comps, precedents, a deal-structure model and a memo. It reports the probability that the offer exceeds DCF value and the chance the deal is accretive, and it runs nine accuracy checks on every SEC-sourced company before showing its figures."},how:[["Fetch and verify","Live price and last-twelve-month financials from SEC EDGAR, with accuracy checks and due-diligence red flags."],["Cost of capital","A CAPM-based WACC from the live Treasury yield and Damodaran's betas and premiums."],["Market cross-check","Trading comps and precedent transactions, benchmarked against the offer."],["DCF engine","A five-year DCF with three scenarios, a sensitivity grid and Monte Carlo ranges."],["Deal structuring","Cash and stock mix, synergies, purchase price allocation and EPS accretion or dilution."],["Thesis and review","A football field across methods and a fact-checked investment memo, exportable to PDF."]],challenges:["Cloud servers are often blocked by Yahoo Finance, so US financials come from the SEC and share prices have several fallback sources.","When live data cannot be fetched, the app labels any AI estimate as unverified instead of presenting it as data."],limits:["The output is only as good as the inputs and assumptions, and the app says so.","Companies outside the US rely on Yahoo Finance, which can block cloud servers."],links:{code:"https://github.com/bshrey0601/M-A-deal-cracker",live:"https://m-a-deal-cracker.onrender.com/",liveNote:"The demo runs on free hosting, so the first load can take up to a minute."},shots:[{src:"assets/projects/ma-deal-cracker-fetch.webp",w:1280,h:720,alt:"M&A Deal Cracker opening screen: fields for a target ticker and an acquirer ticker, a Verify market data button, and six deal modules from Fetch and Verify to Thesis and Review.",cap:"Opening screen: enter a target and an acquirer, then work through six modules"}],shotsNote:"Captured from the app's opening screen, before any deal is loaded."},{id:"bridge-failure-research",featured:!0,title:"Who Bears the Cost When a Bridge Fails?",oneLiner:"Cross-chain stablecoin bridge failure research with a ten-member team",summary:"A study of what happens to bridged stablecoins after the bridge behind them is drained. I built the registry that decided which failures could be studied, and I own the checks on what the paper claims.",period:"Aug 2026 \u2013 Present",status:"Research in progress",role:"Team of 10. I own the event and contract registry, the feasibility counts and the claims audit.",course:"FIN 5507 Seminar in Financial Technology, Olin Business School",categories:["Crypto & Blockchain","Finance","Analytics"],tools:["Public Blockchain Data"],concepts:["Stablecoins","Cross-chain bridges","Data Validation"],source:"report",metrics:[["54","bridge incidents screened, June 2021 to December 2024"],["3","inclusion rules applied to each one"],["7, then 5","incidents that qualified, and cases studied"],["10","outcomes checked for feasibility across 7 cases"]],star:{s:"A bridged stablecoin carries a trusted ticker, but it is really a claim on one bridge's vault. When the vault is drained, the tokens stay on the chain and keep trading with nothing behind them. Our team set out to trace who ends up holding that loss.",t:"Our seminar group of ten asked one question in four parts: what happened to the outstanding tokens, who held them, could holders exit, and how was each case resolved. My job was to decide which failures we could study at all, and to check that the paper claims only what the data support.",a:["Built the event and contract registry: 54 bridge incidents drawn from public incident databases, each screened against three rules. The impairment had to be specific to the bridge, a bridge-issued USD stablecoin claim had to be impaired on a destination chain, and the chain's history had to be available from a free archive.","Narrowed the list to the 7 incidents that met all three rules and the 5 the team studied: four failures (Harmony Horizon, Nomad on Moonbeam, Multichain on Fantom and Orbit on Kaia) and Ronin as a benchmark.","Ran feasibility counts across 10 outcomes and 7 cases, recording where the data passed, were conditional or could not be used. This set the limits of the study before the analysis began.","Own the claims audit, checking the statements in the paper against the tables behind them."],r:"The registry and the feasibility table define the study's scope. All four failures support the core outcomes (supply, prices, depth, exit capacity and recovery), holder data pass for three, and custody backing for two. On that base, the team's preliminary draft finds that the claims stayed outstanding while their price fell to between 0.11 and 0.44 USDT."},how:[["Screen the incidents","54 incidents checked against three inclusion rules.",!0],["Test feasibility","10 outcomes across 7 cases marked pass, conditional or not usable.",!0],["Rebuild the data","The team rebuilt supply, holders, prices, depth, pool trading and payments from public chain data on seven chains."],["Measure the exit","Exit capacity, net absorption by pools and recovery clocks for each case."],["Audit the claims","Each statement in the paper checked against its table.",!0]],findingsTitle:"What the team's preliminary draft finds",findings:["The claims did not go away. In the first 30 days supply changed by between -16.29% and +0.74%, while the price stood at only 0.11 to 0.44 USDT on days 30 to 89.","Pools offered almost no exit at par. Before each failure they could absorb at most 1.24% of claims at 0.99 USDT or better.","Over 90 days, pools absorbed only 2.67% to 7.69% of claims on net, because most selling was matched by buying.","Price recovery was not observed within any case window."],implications:"A bridged token is a claim on one vault. Lending markets and payment firms that accept one need to know the route's backing and its exit capacity, and not only the ticker.",limits:["This is a preliminary team draft from November 2026, so figures may change before the final paper.","Pools the team could not find make the capacity and trading figures lower bounds.","Holder data describe the block before each failure, so the study cannot say who held most claims afterwards.","The study covers EVM chains with free archive data only."],proof:"The paper and its data portal are currently restricted to the team, so there is no public link yet.",links:{},visual:"funnel"},{id:"digital-payments-study",title:"Digital Payments Adoption Study",oneLiner:"A 196-person survey on awareness, use and problems",summary:"My BBA capstone: a primary survey of 196 residents of Gandhinagar on whether they know about digital payments, whether they use them and what goes wrong when they do.",period:"Jan 2023 \u2013 May 2023",status:"Capstone",role:"Led a 5-member team",course:"BBA capstone, KSV University",categories:["Product","Strategy","Analytics"],tools:["Excel"],concepts:["Digital payments","Survey research","Descriptive statistics"],source:"report",metrics:[["196","residents surveyed"],["87.7%","were aware of digital payments"],["67.7%","used them"],["38.5%","had faced a problem"]],star:{s:"Digital payments grew quickly in India after demonetisation, but adoption depends on whether people know the options, trust them and can complete a payment without trouble.",t:"As leader of a five-member capstone team, measure three things for one city: awareness, use, and the problems users face.",a:["Designed a structured questionnaire and collected 196 responses in Gandhinagar using convenience sampling.","Analysed the responses with tables, charts and percentage analysis.","Compared the reasons people choose digital payments with the problems they report, and drew recommendations for banks."],r:"87.7% of respondents were aware of digital payments and 67.7% used them. Time saving and ease of use were the top reasons to choose them, at 34.4% each. 38.5% had faced a problem, most often a failed transaction (31.2%). The report recommends that banks raise awareness of safe use and simplify their terms."},limits:["A convenience sample from one city, with students making up 62.9% of respondents, so the results describe this group and do not generalise.","The analysis is descriptive: tables, charts and percentages."],proof:"Figures are taken from the capstone report submitted in 2023. The report is not published online.",links:{},visual:"survey"},{id:"equity-valuation",title:"Equity Valuation: Reliance Industries",oneLiner:"A DCF and peer valuation that ends in a clear call",summary:"A valuation of Reliance Industries as of 30 December 2022: a five-year DCF under three scenarios, a cross-check against six Indian large-cap peers, and a blended value that led to a Reduce recommendation.",period:"Aug 2022 \u2013 Dec 2022",status:"Case study",role:"Solo project",categories:["Finance"],tools:["Python","pandas","NumPy","Matplotlib","Seaborn","Jupyter"],concepts:["DCF","WACC","Comparable Company Analysis","Scenario and Sensitivity Analysis","EV/EBITDA","P/E"],source:"repo",metrics:[["\u20B92,547","market price on 30 December 2022"],["\u20B92,274 to \u20B93,210","DCF value per share, bear case to bull case"],["\u20B92,225","blended value: 70% DCF, 30% peer multiples"],["12.6% below","the market price, which maps to Reduce"]],star:{s:"Reliance is a conglomerate spanning energy, retail and telecom, which makes it hard to value on peer multiples alone.",t:"Estimate intrinsic value per share from FY2018 to FY2022 financials, and say whether the \u20B92,547 market price was justified.",a:["Projected five years of free cash flow under bear, base and bull growth cases (10%, 14% and 18%) and discounted them at WACC with a Gordon-growth terminal value.","Built a WACC by terminal-growth sensitivity table to show how far the answer depends on those two inputs.","Valued the company against six Indian large-cap peers on EV/EBITDA, EV/Revenue, P/E and P/B.","Blended the two methods 70 to 30 in favour of the DCF and summarised the ranges in a football-field chart.","Turned the model into a browser calculator where the assumptions can be changed."],r:"The DCF valued the stock at \u20B92,274, \u20B92,711 and \u20B93,210 in the bear, base and bull cases. Peer multiples implied far less, from \u20B9552 to \u20B91,486. The blended value of \u20B92,225 sat 12.6% below the market price, which the model's rule maps to Reduce."},limits:["Peer multiples understate a conglomerate with long-term growth drivers, which is why the DCF carries more weight.","The result depends heavily on the WACC, terminal growth, revenue growth and margin assumptions.","This is an academic project and not investment advice."],next:"Live financial data, automatic peer selection by sector and segment-level forecasts.",proof:"The figures can be reproduced by running the notebook in the repository.",links:{code:"https://github.com/bshrey0601/Equity-Valuation",live:"https://bshrey0601.github.io/Equity-Valuation/",liveLabel:"Open the calculator",liveNote:"The calculator opens with its own peer-multiple defaults, so its blended value (\u20B92,322) differs from the notebook's \u20B92,225. Both lead to Reduce."},visual:"football"},{id:"portfolio-risk",title:"Portfolio Risk and Performance Analysis",oneLiner:"Return, drawdown and Value-at-Risk for a five-stock portfolio",summary:"A risk review of a five-stock Indian equity portfolio: annualised return and volatility, Sharpe ratio, maximum drawdown, historical Value-at-Risk and correlation, with alternative weightings compared side by side.",period:"Jan 2022 \u2013 May 2022",status:"Case study",role:"Solo project",categories:["Finance","Analytics"],tools:["Python","pandas","NumPy","Matplotlib","Seaborn","Jupyter"],concepts:["Sharpe ratio","Value-at-Risk","Maximum drawdown","Correlation","Scenario and Sensitivity Analysis","Statistical Analysis"],source:"repo",metrics:[["5","NSE-listed stocks in the portfolio"],["Jan 2019 to Apr 2022","price history analysed"],["95%","confidence level for VaR and expected shortfall"],["5","weight allocations compared"]],star:{s:"A portfolio concentrated in a few names can look fine on return alone. The real questions are what risk was taken to earn it and whether the holdings diversify each other.",t:"Evaluate a five-stock portfolio on risk-adjusted performance, and test whether different weights would do better.",a:["Pulled adjusted closing prices for January 2019 to April 2022 and computed daily returns.","Calculated annualised return, volatility and Sharpe ratio for each stock and for the portfolio.","Measured maximum drawdown, and historical Value-at-Risk and expected shortfall at 95% confidence.","Built the correlation matrix to judge how much diversification the holdings provide.","Compared the current weights with four alternatives, and built an interactive version where the weights can be changed."],r:"A notebook that walks through each measure, and an interactive app that recalculates return, volatility, Sharpe ratio and drawdown when the weights change. The notebook closes with rebalancing recommendations drawn from the scenario comparison."},limits:["The Sharpe ratio assumes a risk-free rate of zero for simplicity.","The interactive app runs on a bundled data sample and not on a live price feed."],proof:"The method is in the repository's notebook. I have not listed result figures here because the notebook is published witho
