sis","Precedent transactions","Equity research","Forecasting","Variance analysis","Scenario analysis","EBITDA & margin analysis","Three-statement modeling","Financial statement analysis","Crypto market research","Digital assets"]},{title:"Analytics & Data",items:["Excel (PivotTables, XLOOKUP, INDEX-MATCH, SUMIFS)","SQL","Python","Tableau","SQL Server","Data validation","Trend analysis","Dashboarding","Reporting automation","Portfolio analytics"]},{title:"AI & FinTech",items:["AI-powered financial tools","Prompt engineering","Gemini API / Google AI Studio","Financial decision-support tools","Workflow automation","GitHub Pages deployment","Business logic design"]},{title:"Business Communication",items:["PowerPoint (pitch decks, CIM-style)","Executive-ready reporting","Management dashboards","KPI scorecards","Stakeholder communication"]}],vp=[{role:"Data Operations Associate",org:"Baroda Global Shared Services Limited",place:"Gandhinagar, India",date:"Jan 2024 \u2013 Jul 2025",points:["Built executive-ready Excel reports and PowerPoint dashboards consolidating productivity, performance, and KPI data for 150+ employees \u2014 directly informing staffing decisions and senior leadership reviews.","Validated 1,000+ financial transaction records daily using reconciliation logic and exception flagging to strengthen reporting accuracy and reduce downstream errors.","Translated 12+ monthly MIS cycles into KPI scorecards, charts, and executive summaries that distilled large datasets into decision-ready narratives.","Coordinated cross-functional reporting workflows and maintained standardized trackers that improved turnaround time and consistency.","Handled confidential employee and financial data with discretion, in line with internal compliance and information-security standards."]},{role:"Finance Intern",org:"Khodiyar Infrastructure",place:"Gandhinagar, India",date:"Jun 2023 \u2013 Dec 2023",points:["Prepared daily transaction and operations reports by compiling Excel datasets, reconciling records, and flagging exceptions for review.","Reviewed 500+ records weekly for completeness and accuracy, strengthening internal controls and reporting reliability.","Built Excel summaries, pivot tables, and charts for recurring management updates \u2014 improving visibility into workflow and performance trends."]}],gp=[{name:"M&A Deal Cracker",date:"Apr 2026 \u2013 May 2026",status:"Live",desc:"AI-powered M&A screening web app that analyzes valuation multiples, synergy potential, key deal terms, risk flags, and comparable benchmarks \u2014 turning raw deal inputs into executive-ready summaries.",details:["Built with a Python Flask backend and a polished HTML/CSS/JS frontend deployed on Render.","Integrated the Gemini API via Google AI Studio for intelligent financial text generation, prompt-engineered to output structured deal memos.","Users input acquirer and target company details (revenue, EBITDA, deal price, synergies), and the app returns an analyst-grade deal summary with valuation multiples (EV/EBITDA, EV/Revenue), accretion/dilution estimates, synergy sizing, risk factors, and comparable transaction benchmarks.","Designed to mirror the workflow of a junior investment banking analyst \u2014 condensing hours of manual screening into structured, AI-generated output in seconds."],tools:["Python","Flask","Google AI Studio","Gemini API","Prompt Engineering","GitHub","Render","Financial Analysis"],impact:"Replicates a junior banker's workflow: combines AI, deal logic, and financial analysis into a practical, deployed decision-support tool. Demonstrates end-to-end product thinking \u2014 from financial logic to deployment.",live:"https://m-a-deal-cracker.onrender.com/",code:"https://github.com/bshrey0601/M-A-deal-cracker",chartType:"dealMetrics"},{name:"LA Crime Analytics Dashboard",date:"May 2026",status:"Academic",desc:"Academic Tableau project built at WashU Olin \u2014 an interactive dashboard analyzing 1M+ crime incident records across Los Angeles (Jan 2020 \u2013 May 2025), spanning 21 police divisions and 140 crime categories, designed to help city leaders identify hotspots, track trends, and allocate resources.",details:["Sourced and cleaned a 1,002,751-row dataset from Data.gov covering 28 fields including incident dates, geographic coordinates, crime codes, victim demographics, weapon types, and case dispositions across all 21 LAPD divisions.","Preprocessed victim demographics (handling nulls, invalid sex codes, negative ages, and extreme outliers), converted HHMM time formats into usable datetime fields, and grouped victim ages into analytical buckets.","Designed three interconnected visualizations: a line chart with time-series forecast projecting future crime counts, a stacked bar chart breaking down crime composition by division, and a rank bump chart tracking how each division's crime ranking shifts month over month.","Built an interactive filter system with Top N selectors, cross-chart filtering (clicking a stacked bar segment updates all views), hover-based line highlighting on the bump chart, and drill-down filters for date range, area, crime type, and weapon type."],tools:["Tableau","Data Cleaning","Data.gov","Time-Series Forecasting","Bump Chart","Stacked Bar Chart","Interactive Dashboards","Data Visualization"],impact:"Demonstrates the ability to take a massive, messy public dataset and turn it into a clean, interactive decision-support tool \u2014 the kind of analytics product that city officials and analysts actually use to direct resources and track outcomes.",live:null,code:null,chartType:"crimeDashboard"},{name:"Equity Valuation & Comparable Company Analysis",date:"Aug 2022 \u2013 Dec 2022",status:"Case study",desc:"Full-scale equity valuation project combining a 5-year DCF model with comparable company analysis (trading comps) to arrive at an intrinsic value range for a publicly traded company.",details:["Projected revenue growth, operating margins, and free cash flows over a 5-year forecast horizon using historical trends and management guidance.","Constructed a WACC-based discounting model with sensitivity analysis across terminal growth rates and discount rates to stress-test valuation assumptions.","Performed comparable company screening using EV/EBITDA, EV/Revenue, and P/E multiples across 8+ peer companies, with adjustments for size, growth, and margin differences.","Delivered a football-field valuation chart summarizing base, upside, and downside scenarios alongside trading-comps-implied ranges."],tools:["Excel","DCF Modeling","Financial Statement Analysis","Scenario Analysis","WACC","Trading Comps","Football Field Chart"],impact:"Demonstrates core equity research and investment analysis skills \u2014 building valuation models from scratch, interpreting financial data, and packaging findings into a clear investment recommendation.",live:null,code:X.github,chartType:"valuation"},{name:"Portfolio Risk & Performance Analysis",date:"Jan 2022 \u2013 May 2022",status:"Case study",desc:"Comprehensive portfolio analytics project evaluating a multi-asset investment portfolio across return, volatility, correlation, diversification, and risk-adjusted performance metrics.",details:["Analyzed historical daily returns for a portfolio of 6 assets spanning U.S. equities, international stocks, bonds, and commodities over a 3-year period.","Computed Sharpe ratio, Sortino ratio, maximum drawdown, and Value-at-Risk (VaR) at 95% confidence to quantify risk-adjusted performance.","Built a correlation matrix and rolling-correlation analysis to evaluate diversification effectiveness and detect regime changes.","Generated efficient frontier plots using Python to identify optimal portfolio weights under mean-variance optimization."],tools:["Python","NumPy","Pandas","Matplotlib","Excel","Portfolio Theory","Risk Analytics","Sharpe Ratio","VaR"],impact:"Demonstrates investment analytics, quantitative risk analysis, and portfolio construction thinking \u2014 skills d
