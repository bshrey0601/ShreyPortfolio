const cx = (...a) => a.filter(Boolean).join(" ");
const norm = (s) => String(s).toLowerCase().replace(/^advanced /, "").trim();

const reducedMotion = () =>
  typeof window !== "undefined" && window.matchMedia &&
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function projectHasSkill(p, skill){
  const k = norm(skill);
  return [...p.tools, ...p.concepts].some((x) => norm(x) === k);
}
function skillCount(skill){ return PROJECTS.filter((p) => projectHasSkill(p, skill)).length; }
function matchesQuery(p, q){
  if(!q.trim()) return true;
  const hay = [p.title, p.oneLiner, p.summary, p.status, p.role, ...p.categories, ...p.tools, ...p.concepts]
    .join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}

function parseHash(){
  const h = window.location.hash || "";
  if(h.startsWith("#/projects/")){
    return { view:"project", id: decodeURIComponent(h.slice(11)).replace(/\/+$/, "") };
  }
  if(h.startsWith("#/") && h.length > 2) return { view:"missing" };
  return { view:"home", anchor: h.replace(/^#\/?/, "") };
}

function useInView(){
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current; if(!el) return;
    if(!("IntersectionObserver" in window) || reducedMotion()){ setSeen(true); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if(e.isIntersecting){ setSeen(true); io.disconnect(); } });
    }, { threshold:0.1, rootMargin:"0px 0px -6% 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return [ref, seen];
}

function Reveal({ children, delay=0, className="" }){
  const [ref, seen] = useInView();
  return (
    <div ref={ref} className={cx("rv", seen && "in", className)} style={{ transitionDelay: delay + "ms" }}>
      {children}
    </div>
  );
}

  }, []);

  useEffect(() => { setOpen(false); }, [route]);

  useEffect(() => {
    const place = () => {
      const el = links.current[active], box = wrap.current;
      if(route.view === "home" && el && box){
        const a = el.getBoundingClientRect(), b = box.getBoundingClientRect();
        setInd({ left:a.left - b.left, width:a.width, on:true });

function Experience(){
  const list = useRef(null);
  const fill = useRef(null);
  const [reached, setReached] = useState(reducedMotion() ? EXPERIENCE.length : 0);

  useEffect(() => {
    if(reducedMotion()){ if(fill.current) fill.current.style.transform = "scaleY(1)"; return; }
    let raf = 0;
    const update = () => {
      raf = 0;
      const el = list.current; if(!el) return;
      const r = el.getBoundingClientRect();
      const mark = window.innerHeight * 0.62;
      const p = Math.max(0, Math.min(1, (mark - r.top) / Math.max(1, r.height)));
      if(fill.current) fill.current.style.transform = "scaleY(" + p + ")";
      let n = 0;
      el.querySelectorAll("[data-tl-item]").forEach((it) => { if(it.getBoundingClientRect().top + 14 < mark) n += 1; });
      setReached((prev) => (prev === n ? prev : Math.max(prev, n)));
    };
    const onScroll = () => { if(!raf) raf = requestAnimationFrame(update); };
    update();
    window.addEventListener("scroll", onScroll, { passive:true });
    window.addEventListener("resize", onScroll);
    return () => { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); if(raf) cancelAnimationFrame(raf); };
  }, []);

  return (
    <section id="experience" className="sec">
      <div className="max-w-page mx-auto px-5 sm:px-8 grid lg:grid-cols-12 gap-x-10 gap-y-10">
        <SectionHead title="Experience" sub="Four roles, newest first. Open any one for the full story: situation, task, action and result."/>
        <div className="lg:col-span-8">
          <ol ref={list} className="tl space-y-6">
            <span className="tl-track" aria-hidden="true"><span ref={fill} className="tl-fill"></span></span>
            {EXPERIENCE.map((e, i) => (<ExperienceItem key={e.id} e={e} defaultOpen={i === 0} reached={i < reached}/>))}
          </ol>
        </div>
      </div>
    </section>
  );
}

/* =====================================================================

function CaseSection({ id, title, children }){
  return (
    <section id={id} className="pt-12 first:pt-0">
      <h2 className="t-h2 text-[1.55rem]">{title}</h2>
      <div className="mt-5">{children}</div>
    </section>
  );
}

function BulletList({ items }){
  return (
    <ul className="space-y-3 measure text-soft">
      {items.map((t) => (
        <li key={t} className="flex gap-3"><span className="mt-[.62em] w-1.5 h-1.5 rounded-full bg-gold flex-none" aria-hidden="true"></span><span>{t}</span></li>
      ))}
    </ul>
  );
}

function CaseStudy({ p }){
  const h1 = useRef(null);
  useEffect(() => { if(h1.current) h1.current.focus({ preventScroll:true }); }, [p.id]);

  const idx = PROJECTS.findIndex((x) => x.id === p.id);
  const prev = PROJECTS[(idx - 1 + PROJECTS.length) % PROJECTS.length];
  const next = PROJECTS[(idx + 1) % PROJECTS.length];

  const visual = !p.shots && p.visual && p.visual !== "pipeline";
  const toc = [
    ["story", "The story"],
    p.how && ["how", "How it works"],
    (p.shots || visual) && ["visuals", p.shots ? "Screens" : "The numbers"],
    p.findings && ["findings", "Findings"],
    ["stack", "Tools and concepts"],
    (p.challenges || p.limits) && ["limits", "Challenges and limits"],
    (p.learned || p.next) && ["next", "Lessons and next steps"],
  ].filter(Boolean);
  const jump = (e, id) => { e.preventDefault(); const el = document.getElementById(id); if(el) el.scrollIntoView(); };

  return (
    <div className="view pt-[104px] pb-24">
      <div className="max-w-page mx-auto px-5 sm:px-8">
        <a href="#all-projects" className="inline-flex items-center gap-2 text-soft hover:text-paper transition-colors"><Icon.back className="w-4 h-4"/>All projects</a>

        <header className="mt-7 grid lg:grid-cols-12 gap-x-10 gap-y-8">
          <div className="lg:col-span-8">
            <p className="flex flex-wrap items-center gap-2 text-[.9rem] text-soft t-num">
              <StatusChip status={p.status}/>{p.categories.map((c) => (<span key={c} className="chip">{c}</span>))}
            </p>
            <h1 ref={h1} tabIndex={-1} className="t-display text-[clamp(2.1rem,4.6vw,3.5rem)] mt-5 outline-none">{p.title}</h1>
            <p className="t-lede text-paper mt-4 measure">{p.oneLiner}</p>
            <p className="mt-4 text-soft measure">{p.summary}</p>
            {(p.links.live || p.links.code) && (
              <div className="mt-6 flex flex-wrap gap-3"><ProjectLinks p={p}/></div>
            )}
            {p.links.liveNote && <p className="t-label mt-3">{p.links.liveNote}</p>}
          </div>
          <dl className="lg:col-span-4 self-start border-t border-white/10">
            {[["My role", p.role], ["When", p.period], p.course && ["Context", p.course], ["Status", p.status]].filter(Boolean).map(([k, v]) => (
              <div key={k} className="py-3 border-b border-white/10">
                <dt className="t-label">{k}</dt>
                <dd className="mt-0.5 text-[.98rem]">{v}</dd>
              </div>
            ))}
          </dl>
        </header>

        <section aria-label="Results at a glance" className="mt-10 panel p-5 sm:p-7">
          <dl className="grid grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-7">
            {p.metrics.map(([fig, label]) => (
              <div key={label} className="flex flex-col-reverse justify-end">
                <dt className="mt-1.5 text-[.92rem] text-soft leading-snug">{label}</dt>
                <dd className="t-fig t-num text-[clamp(1.25rem,2.4vw,1.75rem)]">{fig}</dd>
              </div>
            ))}
          </dl>
          <p className="mt-6 pt-4 border-t border-white/10 flex flex-wrap items-center gap-3 text-[.92rem] text-soft"><Src kind={p.source}/>{p.proof}</p>
        </section>

        <div className="mt-14 grid lg:grid-cols-12 gap-x-10">
          <nav aria-label="On this page" className="cs-nav hidden lg:block lg:col-span-3 lg:sticky lg:top-[96px] self-start">
            <p className="t-label mb-2">On this page</p>
            {toc.map(([id, label]) => (<a key={id} href={"#" + id} onClick={(e) => jump(e, id)}>{label}</a>))}
          </nav>

          <div className="lg:col-span-9">
            <CaseSection id="story" title="The story">
              <div className="measure"><StarBlock star={p.star} level={3}/></div>
            </CaseSection>

            {p.how && (
              <CaseSection id="how" title="How it works">
                <Steps steps={p.how}/>
                {p.how.some((s) => s[2]) && <p className="t-label mt-4">Steps marked “My work” are the parts I own. The rest is the team's.</p>}
              </CaseSection>
            )}

            {p.shots && (
              <CaseSection id="visuals" title="Screens">
                <div className="grid sm:grid-cols-2 gap-5">
                  {p.shots.map((s, i) => (
                    <figure key={s.src} className={i === 0 ? "sm:col-span-2" : ""}>
                      <ExtLink href={s.src} className="frame" label={"Open full size: " + s.cap}>
                        <img src={s.src} alt={s.alt} width={s.w} height={s.h} loading="lazy"/>
                      </ExtLink>
                      <figcaption className="t-label mt-2">{s.cap}</figcaption>
                    </figure>
                  ))}
                </div>
                <p className="t-label mt-4">{p.shotsNote || "Screenshots from the running app."} Select an image to open it full size.</p>
              </CaseSection>
            )}

            {visual && (
              <CaseSection id="visuals" title="The numbers">
                <div className="max-w-[640px]"><ProjectVisual p={p}/></div>
              </CaseSection>
            )}

            {p.findings && (
              <CaseSection id="findings" title={p.findingsTitle || "Findings"}>
                <BulletList items={p.findings}/>
                {p.implications && <p className="mt-6 pl-4 border-l-2 border-gold/60 measure"><span className="font-semibold">Why it matters. </span><span className="text-soft">{p.implications}</span></p>}
              </CaseSection>
            )}

            <CaseSection id="stack" title="Tools and concepts">
              <p className="t-label">Tools and data</p>
              <ul className="mt-2 flex flex-wrap gap-2">{p.tools.map((t) => (<li key={t} className="chip">{t}</li>))}</ul>
              <p className="t-label mt-5">Finance and analytics concepts</p>
              <ul className="mt-2 flex flex-wrap gap-2">{p.concepts.map((t) => (<li key={t} className="chip">{t}</li>))}</ul>
              {p.stackNote && <p className="mt-5 text-soft measure">{p.stackNote}</p>}
            </CaseSection>

            {(p.challenges || p.limits) && (
              <CaseSection id="limits" title="Challenges and limits">
                {p.challenges && (<><h3 className="font-semibold mb-3">What was hard</h3><BulletList items={p.challenges}/></>)}
                {p.limits && (<><h3 className={cx("font-semibold mb-3", p.challenges && "mt-8")}>What this does not show</h3><BulletList items={p.limits}/></>)}
              </CaseSection>
            )}

            {(p.learned || p.next) && (
              <CaseSection id="next" title="Lessons and next steps">
                <div className="measure space-y-4 text-soft">
                  {p.learned && <p><span className="text-paper font-semibold">What I learned. </span>{p.learned}</p>}
                  {p.next && <p><span className="text-paper font-semibold">What comes next. </span>{p.next}</p>}
                </div>
              </CaseSection>
            )}
          </div>
        </div>

        <nav aria-label="More projects" className="mt-20 pt-8 border-t border-white/10 grid sm:grid-cols-2 gap-4">
          <a href={"#/projects/" + prev.id} className="panel p-5 hover:border-white/25 transition-colors">
            <span className="t-label flex items-center gap-2"><Icon.back className="w-4 h-4"/>Previous project</span>
            <span className="block mt-1.5 font-semibold">{prev.title}</span>
          </a>
          <a href={"#/projects/" + next.id} className="panel p-5 hover:border-white/25 transition-colors sm:text-right">
            <span className="t-label flex items-center gap-2 sm:justify-end">Next project<Icon.go className="w-4 h-4"/></span>
            <span className="block mt-1.5 font-semibold">{next.title}</span>
          </a>
        </nav>
      </div>
    </div>
  );
}

function NotFound(){
  return (
    <div className="view pt-[150px] pb-32">
      <div className="max-w-page mx-auto px-5 sm:px-8">
        <h1 className="t-display text-[clamp(2.1rem,4.6vw,3.5rem)]">This page does not exist.</h1>
        <p className="t-lede mt-4 measure">The address does not match a page on this site. The project may have been renamed.</p>
        <div className="mt-8 flex flex-wrap gap-3">
          <a href="#top" className="btn btn-primary">Go to the home page</a>
          <a href="#all-projects" className="btn btn-quiet">See all projects</a>
        </div>
      </div>
    </div>
  );
}

/* =====================================================================
   9. APP
   ===================================================================== */

const BASE_TITLE = "Shrey Bhatt | Finance, FinTech and Strategy Portfolio";

function App(){
  const [route, setRoute] = useState(parseHash());
  const [active, setActive] = useState("top");
  const [filter, setFilter] = useState({ cat:"All", q:"", skill:"" });
  const [toast, setToast] = useState("");
  const bar = useRef(null);
  const last = useRef({ view:null, y:0, anchor:"" });
  const viaLink = useRef(false);

  /* A click on an in-page link should go to its target. Back and forward restore the old position. */
  useEffect(() => {
    const onClick = (e) => { if(e.target.closest && e.target.closest('a[href^="#"]')) viaLink.current = true; };
    document.addEventListener("click", onClick, true);
    return () => document.removeEventListener("click", onClick, true);
  }, []);

  useEffect(() => {
    const onHash = () => {
      if(last.current.view === "home") last.current.y = window.scrollY;
      setRoute(parseHash());
    };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const project = route.view === "project" ? PROJECTS.find((p) => p.id === route.id) : null;
  const view = route.view === "project" && !project ? "missing" : route.view;

  /* Scroll and title on every route change. */
  useEffect(() => {
    const prev = last.current;
    const clicked = viaLink.current; viaLink.current = false;
    const jump = (top) => window.scrollTo({ top, left:0, behavior:"instant" });
    if(view === "home"){
      document.title = BASE_TITLE;
      if(prev.view !== "home"){
        requestAnimationFrame(() => {
          const el = route.anchor && document.getElementById(route.anchor);
          if(!clicked && prev.view && prev.anchor === route.anchor && prev.y) jump(prev.y);
          else if(el) el.scrollIntoView({ behavior:"instant" });
          else jump(0);
        });
      }
      last.current = { view:"home", y:window.scrollY, anchor:route.anchor };
    } else {
      document.title = (project ? project.title : "Page not found") + " | Shrey Bhatt";
      jump(0);
      last.current = { ...prev, view };
    }
  }, [route]);

  /* Which section is on screen (home only). */
  useEffect(() => {
    if(view !== "home" || !("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if(e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin:"-40% 0px -55% 0px" });
    ["top", ...NAV.map((n) => n[0])].forEach((id) => { const el = document.getElementById(id); if(el) io.observe(el); });
    return () => io.disconnect();
  }, [view]);

  /* Reading progress. */
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
      if(bar.current) bar.current.style.transform = "scaleX(" + Math.max(0, Math.min(1, p)) + ")";
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive:true });
    return () => window.removeEventListener("scroll", onScroll);
  }, [view]);

  useEffect(() => {
    if(!toast) return;
    const t = setTimeout(() => setToast(""), 2600);
    return () => clearTimeout(t);
  }, [toast]);

  const pickSkill = useCallback((skill) => {
    setFilter({ cat:"All", q:"", skill });
    const el = document.getElementById("all-projects");
    if(el) el.scrollIntoView();
  }, []);

  return (
    <>
      <div ref={bar} className="progress" aria-hidden="true"></div>
      <Nav route={{ ...route, view }} active={active}/>
      <main id="main">
        {view === "home" && (
          <>
            <Hero/>
            <About/>
            <Experience/>
            <Projects filter={filter} setFilter={setFilter}/>
            <Skills onPick={pickSkill}/>
            <Education/>
            <Contact notify={setToast}/>
          </>
        )}
        {view === "project" && <CaseStudy key={project.id} p={project}/>}
        {view === "missing" && <NotFound/>}
      </main>
      <Footer/>
      <div role="status" aria-live="polite"
           className={cx("fixed left-1/2 -translate-x-1/2 bottom-6 z-[200] px-4 py-2.5 rounded-lg bg-paper text-ink font-semibold text-[.95rem] shadow-2xl transition-all duration-300",
                         toast ? "opacity-100 translate-y-0" : "opacity-0 translate-y-3 pointer-events-none")}>
        {toast}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

requestAnimationFrame(() => {
  setTimeout(() => { const b = document.getElementById("boot"); if(b) b.classList.add("hide"); }, 250);
});
</script>
